services:
  app:
    build: .
    env_file: .env
    environment:
      FLASK_CONFIG: production
    ports:
      - "5050:5050"

    volumes:
      - minty-data:/app/instance
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5050/healthz')"]
      interval: 30s
      timeout: 5s
      retries: 3

volumes:
  minty-data:
