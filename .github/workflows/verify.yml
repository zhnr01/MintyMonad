name: verify

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          version: latest
      - name: Install dependencies
        run: uv venv --python 3.11 && uv pip install --python .venv/bin/python -r requirements.txt
      - name: Run tests
        run: uv run --python .venv/bin/python pytest -q
      - name: Compile Python
        run: uv run --python .venv/bin/python python -m compileall -q app config.py create_db.py deploy.py manage.py withdrawfee.py
      - name: Compile Vyper contract
        run: uvx --python 3.11 --from vyper==0.4.3 vyper contracts/NFTMarketplace.vy
      - name: Validate Compose manifest
        run: cp .env.example .env && docker compose config >/dev/null
